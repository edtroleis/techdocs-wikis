<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Arquitetura de referência</title>
  <desc id="d">Canais acessam serviços de domínio por um gateway; serviços trocam eventos e têm dados próprios; plataforma, observabilidade e segurança são transversais.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- fundo próprio: a figura fica legível em tema claro e escuro -->
  <rect width="880" height="470" rx="14" fill="#f8fafc"/>

  <!-- Canais -->
  <rect x="30" y="24" width="640" height="72" rx="10" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="46" y="46" font-size="13" font-weight="700" fill="#1e3a8a">CANAIS</text>
  <g font-size="13" fill="#1e293b" text-anchor="middle">
    <rect x="60" y="56" width="160" height="30" rx="6" fill="#fff" stroke="#93c5fd"/><text x="140" y="76">Web (CDN)</text>
    <rect x="260" y="56" width="160" height="30" rx="6" fill="#fff" stroke="#93c5fd"/><text x="340" y="76">Mobile</text>
    <rect x="460" y="56" width="180" height="30" rx="6" fill="#fff" stroke="#93c5fd"/><text x="550" y="76">Parceiros</text>
  </g>

  <!-- Gateway -->
  <line x1="350" y1="96" x2="350" y2="120" stroke="#475569" stroke-width="2" marker-end="url(#seta)"/>
  <rect x="200" y="122" width="300" height="34" rx="17" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="350" y="144" font-size="13" text-anchor="middle" fill="#78350f" font-weight="600">API gateway · autenticação · rate limit</text>
  <line x1="350" y1="156" x2="350" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#seta)"/>

  <!-- Serviços de domínio -->
  <rect x="30" y="182" width="640" height="150" rx="10" fill="#dcfce7" stroke="#22c55e"/>
  <text x="46" y="204" font-size="13" font-weight="700" fill="#14532d">SERVIÇOS DE DOMÍNIO</text>
  <g font-size="13" fill="#1e293b" text-anchor="middle">
    <rect x="60" y="216" width="160" height="40" rx="6" fill="#fff" stroke="#86efac"/><text x="140" y="241">Serviço A</text>
    <rect x="260" y="216" width="160" height="40" rx="6" fill="#fff" stroke="#86efac"/><text x="340" y="241">Serviço B</text>
    <rect x="460" y="216" width="180" height="40" rx="6" fill="#fff" stroke="#86efac"/><text x="550" y="241">Serviço C</text>
  </g>
  <!-- barramento de eventos -->
  <rect x="60" y="282" width="580" height="30" rx="6" fill="#ecfccb" stroke="#84cc16" stroke-dasharray="5 4"/>
  <text x="350" y="302" font-size="13" text-anchor="middle" fill="#365314">Barramento de eventos (assíncrono)</text>
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#seta)" marker-start="url(#seta)">
    <line x1="140" y1="258" x2="140" y2="280"/>
    <line x1="340" y1="258" x2="340" y2="280"/>
    <line x1="550" y1="258" x2="550" y2="280"/>
  </g>

  <!-- Dados -->
  <line x1="350" y1="332" x2="350" y2="356" stroke="#475569" stroke-width="2" marker-end="url(#seta)"/>
  <rect x="30" y="358" width="640" height="88" rx="10" fill="#f3e8ff" stroke="#a855f7"/>
  <text x="46" y="380" font-size="13" font-weight="700" fill="#581c87">DADOS</text>
  <g font-size="13" fill="#1e293b" text-anchor="middle">
    <ellipse cx="140" cy="412" rx="80" ry="20" fill="#fff" stroke="#d8b4fe"/><text x="140" y="417">Banco por serviço</text>
    <ellipse cx="340" cy="412" rx="80" ry="20" fill="#fff" stroke="#d8b4fe"/><text x="340" y="417">Cache</text>
    <ellipse cx="550" cy="412" rx="90" ry="20" fill="#fff" stroke="#d8b4fe"/><text x="550" y="417">Data lake / warehouse</text>
  </g>

  <!-- Transversais -->
  <g font-size="13" text-anchor="middle" font-weight="600">
    <rect x="700" y="24" width="150" height="132" rx="10" fill="#e2e8f0" stroke="#64748b"/>
    <text x="775" y="80" fill="#0f172a">Plataforma</text>
    <text x="775" y="100" font-weight="400" font-size="12" fill="#334155">CI/CD · Backstage</text>
    <text x="775" y="116" font-weight="400" font-size="12" fill="#334155">containers</text>

    <rect x="700" y="168" width="150" height="132" rx="10" fill="#e2e8f0" stroke="#64748b"/>
    <text x="775" y="224" fill="#0f172a">Observabilidade</text>
    <text x="775" y="244" font-weight="400" font-size="12" fill="#334155">logs · métricas</text>
    <text x="775" y="260" font-weight="400" font-size="12" fill="#334155">traces</text>

    <rect x="700" y="312" width="150" height="134" rx="10" fill="#fee2e2" stroke="#ef4444"/>
    <text x="775" y="370" fill="#7f1d1d">Segurança</text>
    <text x="775" y="390" font-weight="400" font-size="12" fill="#7f1d1d">IAM · segredos</text>
    <text x="775" y="406" font-weight="400" font-size="12" fill="#7f1d1d">criptografia</text>
  </g>
</svg>
